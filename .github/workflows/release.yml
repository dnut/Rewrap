name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --tags --force origin
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - run: nix develop -c ./do package
      - run: nix develop -c ./do release-notes "${GITHUB_REF_NAME#v}"

      - name: Read release channel from tag annotation
        id: channel
        run: |
          tag_message="$(git tag -l "$GITHUB_REF_NAME" --format='%(contents)')"

          if grep -qi '\bstable\b' <<< "$tag_message"; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif grep -Eqi '\bpre[- ]?release\b' <<< "$tag_message"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag annotation must contain 'stable' or 'prerelease'." >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          files: dist/*.vsix
          prerelease: ${{ steps.channel.outputs.prerelease }}
