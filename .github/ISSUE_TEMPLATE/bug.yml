name: Other Bugs
description: Something went wrong, and it was not an incorrect wrap.
title: "[Bug] "
labels: ["bug"]

body:
  - type: input
    id: version
    attributes:
      label: Rewrap Revived Version
      placeholder: e.g. 18.3.0
    validations:
      required: true

  - type: dropdown
    id: ide
    attributes:
      label: IDE
      options:
        - Visual Studio Code
        - Visual Studio
        - Code - OSS
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Rewrap Configuration
      description: |
        Mention any relevant rewrap or ruler settings you have modified
      placeholder: |
        Wrapping column: 80
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: |
        Expected Result: I made a cool app
        Actual Result: Computer exploded
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: |
        Logs, screenshots, VS Code version, other extensions... All of this context is helpful if you can provide it.
        To get your VS Code version: Go to Help > About and then click "Copy".
        To get a list of all extensions: code --list-extensions --show-versions
    validations:
      required: false
